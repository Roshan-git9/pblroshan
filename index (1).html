<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f0e0c;
      --ink-soft: #5a5650;
      --ink-muted: #9e9890;
      --surface: #faf9f6;
      --surface-raised: #ffffff;
      --surface-sunken: #f0ede7;
      --accent: #1a3a2a;
      --accent-mid: #2d6a4a;
      --accent-light: #e8f3ed;
      --accent-glow: #4caf7d;
      --warn: #b85c1a;
      --warn-light: #fdf0e6;
      --border: #e2ddd6;
      --border-light: #ede9e2;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(15,14,12,0.08), 0 4px 16px rgba(15,14,12,0.05);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--surface);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      background: var(--accent);
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.35rem;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .logo span { color: var(--accent-glow); }
    .header-tag {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 2rem;
      align-items: start;
    }

    .card {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-header {
      padding: 1.5rem 1.75rem 1.25rem;
      border-bottom: 1px solid var(--border-light);
    }
    .card-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.3;
    }
    .card-header p {
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 3px;
    }
    .card-body { padding: 1.5rem 1.75rem; }

    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 5px;
    }
    .field input[type="text"] {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-sunken);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--ink);
      transition: border-color 0.15s, background 0.15s;
      outline: none;
    }
    .field input[type="text"]:focus {
      border-color: var(--accent-mid);
      background: #fff;
    }
    .field input[type="text"]::placeholder { color: var(--ink-muted); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 42px;
      padding: 0 20px;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }
    .btn-primary:hover { background: var(--accent-mid); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--ink-soft);
    }
    .btn-secondary:hover {
      border-color: var(--accent-mid);
      color: var(--accent-mid);
      background: var(--accent-light);
    }

    .feedback {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-top: 12px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .feedback.success {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid #b8ddc7;
    }
    .feedback.error {
      background: var(--warn-light);
      color: var(--warn);
      border: 1px solid #f5c99a;
    }

    .panel-header {
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .panel-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      font-weight: 400;
    }
    .panel-right { display: flex; align-items: center; gap: 10px; }

    .badge {
      background: var(--surface-sunken);
      border: 1px solid var(--border);
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
      min-width: 28px;
      text-align: center;
    }
    .badge.active {
      background: var(--accent-light);
      border-color: #b8ddc7;
      color: var(--accent);
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead tr { background: var(--surface-sunken); }
    th {
      padding: 11px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border-light);
      color: var(--ink);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface-sunken); }

    .td-id {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: var(--ink-muted);
      background: var(--surface-sunken);
      padding: 3px 8px;
      border-radius: 5px;
      display: inline-block;
    }
    .td-name { font-weight: 500; }
    .td-class {
      background: var(--accent-light);
      color: var(--accent-mid);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      display: inline-block;
    }

    .empty-state {
      padding: 3.5rem 2rem;
      text-align: center;
    }
    .empty-icon {
      width: 52px;
      height: 52px;
      background: var(--surface-sunken);
      border-radius: 50%;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-state p { color: var(--ink-muted); font-size: 14px; }
    .empty-state strong {
      display: block;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }

    .loading {
      padding: 2.5rem;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
      display: none;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent-mid);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search-wrap { position: relative; }
    .search-wrap input {
      width: 200px;
      height: 34px;
      padding: 0 12px 0 34px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--surface-sunken);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: var(--accent-mid); background: #fff; }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-muted);
      pointer-events: none;
    }

    .divider { height: 1px; background: var(--border-light); margin: 1.25rem 0; }

    @media (max-width: 780px) {
      .page { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .search-wrap input { width: 150px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Student<span>.</span>Portal</div>
  <span class="header-tag">Management System</span>
</header>

<div class="page">

  <!-- LEFT: Add Student -->
  <div>
    <div class="card">
      <div class="card-header">
        <h2>Add a Student</h2>
        <p>Fill in the details and save the record.</p>
      </div>
      <div class="card-body">
        <div class="field">
          <label>Student ID</label>
          <input type="text" id="studentid" placeholder="e.g. STU-2024-001">
        </div>
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="e.g. Aryan Mehta">
        </div>
        <div class="form-row">
          <div class="field">
            <label>Class</label>
            <input type="text" id="class" placeholder="e.g. 10-A">
          </div>
          <div class="field">
            <label>Age</label>
            <input type="text" id="age" placeholder="e.g. 16">
          </div>
        </div>
        <div class="divider"></div>
        <button class="btn btn-primary" id="savestudent">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M2 8l4 4 8-8"/>
          </svg>
          Save Student
        </button>
        <div class="feedback" id="saveFeedback"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Students Table -->
  <div>
    <div class="card">
      <div class="panel-header">
        <h2>All Students</h2>
        <div class="panel-right">
          <div class="search-wrap">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search…">
          </div>
          <span class="badge" id="countBadge">–</span>
          <button class="btn btn-secondary" id="getstudents" style="height:34px; padding: 0 14px; font-size:13px;">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M1 8a7 7 0 107-7"/><polyline points="1 1 1 8 8 8"/>
            </svg>
            Refresh
          </button>
        </div>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        Fetching student records…
      </div>

      <div class="table-wrap">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#9e9890" stroke-width="1.5">
              <rect x="3" y="3" width="16" height="16" rx="3"/>
              <line x1="7" y1="8" x2="15" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/>
            </svg>
          </div>
          <strong>No students yet</strong>
          <p>Click Refresh to load records, or add a new student.</p>
        </div>
        <table id="studentTable" style="display:none;">
          <thead>
            <tr>
              <th>Student ID</th>
              <th>Name</th>
              <th>Class</th>
              <th>Age</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  var API_ENDPOINT = "https://ecnm2tb4tb.execute-api.us-east-2.amazonaws.com/prod";
  var allStudents = [];

  function showFeedback(type, message) {
    var icon = type === 'success'
      ? '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7l3.5 3.5L12 3"/></svg>'
      : '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><line x1="7" y1="4.5" x2="7" y2="7.5"/></svg>';
    var el = document.getElementById('saveFeedback');
    el.className = 'feedback ' + type;
    el.innerHTML = icon + ' ' + message;
    el.style.display = 'flex';
    setTimeout(function() { el.style.display = 'none'; }, 3500);
  }

  function renderTable(students) {
    var tbody = $('#studentTable tbody');
    tbody.empty();
    if (!students || students.length === 0) {
      $('#studentTable').hide();
      $('#emptyState').show();
      $('#countBadge').text('0');
      return;
    }
    $.each(students, function(i, d) {
      tbody.append(
        '<tr>' +
        '<td><span class="td-id">' + (d['studentid'] || '—') + '</span></td>' +
        '<td class="td-name">' + (d['name'] || '—') + '</td>' +
        '<td><span class="td-class">' + (d['class'] || '—') + '</span></td>' +
        '<td>' + (d['age'] || '—') + '</td>' +
        '</tr>'
      );
    });
    $('#studentTable').show();
    $('#emptyState').hide();
    $('#countBadge').text(students.length).addClass('active');
  }

  document.getElementById('searchInput').addEventListener('input', function() {
    var q = this.value.toLowerCase();
    if (!q) { renderTable(allStudents); return; }
    var filtered = allStudents.filter(function(d) {
      return (d['studentid']||'').toLowerCase().includes(q) ||
             (d['name']||'').toLowerCase().includes(q) ||
             (d['class']||'').toLowerCase().includes(q) ||
             String(d['age']||'').includes(q);
    });
    renderTable(filtered);
  });

  // Save student — preserves original POST logic
  document.getElementById('savestudent').onclick = function() {
    var sid = $('#studentid').val().trim();
    var nm  = $('#name').val().trim();
    var cl  = $('#class').val().trim();
    var ag  = $('#age').val().trim();
    if (!sid || !nm || !cl || !ag) {
      showFeedback('error', 'Please fill in all fields before saving.');
      return;
    }
    var inputData = { "studentid": sid, "name": nm, "class": cl, "age": ag };
    $.ajax({
      url: API_ENDPOINT,
      type: 'POST',
      data: JSON.stringify(inputData),
      contentType: 'application/json; charset=utf-8',
      success: function() {
        showFeedback('success', 'Student record saved successfully!');
        $('#studentid,#name,#class,#age').val('');
      },
      error: function() {
        showFeedback('error', 'Error saving record. Check your API or network.');
      }
    });
  };

  // Fetch students — preserves original GET logic
  document.getElementById('getstudents').onclick = function() {
    $('#emptyState').hide();
    $('#studentTable').hide();
    $('#loading').show();
    $('#countBadge').text('…').removeClass('active');
    $.ajax({
      url: API_ENDPOINT,
      type: 'GET',
      contentType: 'application/json; charset=utf-8',
      success: function(response) {
        $('#loading').hide();
        allStudents = Array.isArray(response) ? response : [];
        renderTable(allStudents);
      },
      error: function() {
        $('#loading').hide();
        $('#emptyState').show();
        showFeedback('error', 'Could not fetch students. Check your API endpoint.');
      }
    });
  };
</script>

</body>
</html>
